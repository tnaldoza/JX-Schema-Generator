name: Scorecard

# ! Scorecard publishing rejects top-level defaults and env
on:
  branch_protection_rule:
  schedule:
    - cron: "15 14 * * 0"
  push:
    branches: [master]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # ! Scorecard publishes results only for public repositories, and code scanning elsewhere needs Code Security
    if: ${{ github.event.repository.default_branch == github.ref_name && github.event.repository.visibility == 'public' }}
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write # sign results published to api.scorecard.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
