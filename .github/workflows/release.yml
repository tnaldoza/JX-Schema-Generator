name: Release

on:
  workflow_dispatch:
    inputs:
      tpg-version:
        description: TPG release such as 2026.1.00, blank for the highest listed version
        type: string
        required: false

permissions: {}

cache-mode: none

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build schema bundle
    # ! workflow_dispatch accepts any branch, and only the default branch may publish a release
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.package.outputs.tag }}
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
    steps:
      - name: Validate inputs
        env:
          TPG_VERSION: ${{ inputs.tpg-version }}
        run: |
          if [[ -n "$TPG_VERSION" && ! "$TPG_VERSION" =~ ^[0-9]{4}\.[0-9]+\.[0-9]{2}$ ]]; then
              echo "::error::tpg-version must look like 2026.1.00"
              exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet build JXSchemaGenerator.slnx -c Release
      - run: dotnet test --solution JXSchemaGenerator.slnx -c Release --no-build --minimum-expected-tests 1
      # ? The runner's preinstalled Node is enough, since the fetcher uses only built-in modules
      - name: Fetch TPG XSDs
        env:
          TPG_VERSION: ${{ inputs.tpg-version }}
        run: |
          args=()
          if [[ -n "$TPG_VERSION" ]]; then args+=(--version "$TPG_VERSION"); fi
          node scripts/fetch-xsd.js "${args[@]}"
      - name: Generate
        run: dotnet run --project src/JXSchemaGenerator.Cli -c Release --no-build -- generate --input schemas --out dist/schemas
      - name: Package
        id: package
        run: |
          mapfile -t versions < <(grep -ohE 'version="[0-9]{4}\.[0-9]+\.[0-9]{2}"' schemas/TPG_*Master.xsd | sort -u)
          if [[ ${#versions[@]} -ne 1 ]]; then
              echo "::error::Master XSDs disagree on version: ${versions[*]}"
              exit 1
          fi
          tpg="${versions[0]#version=\"}"
          tpg="${tpg%\"}"
          tag="tpg-${tpg}-${GITHUB_SHA::7}"
          # ? Sorted entries and commit-time mtimes make reruns of one commit byte-identical
          epoch="$(git log -1 --format=%ct)"
          find dist/schemas -exec touch -d "@${epoch}" {} +
          (cd dist && find schemas -type f -print | LC_ALL=C sort | zip -X -D -q -@ ../jxchange-schemas.zip)
          sha256sum jxchange-schemas.zip > SHA256SUMS
          printf 'Generated jXchange element mappings\n\n- TPG version: %s\n- Commit: %s\n' "$tpg" "$GITHUB_SHA" > notes.md
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: |
            jxchange-schemas.zip
            SHA256SUMS
            notes.md
          if-no-files-found: error
          retention-days: 7

  # ! Runs no repository code, so the write token never meets the build
  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # create the tag, release and assets
      id-token: write # Sigstore signing certificate for the attestation
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
      - run: sha256sum --check --strict SHA256SUMS
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          if [[ ! "$TAG" =~ ^tpg-[0-9]{4}\.[0-9]+\.[0-9]{2}-[0-9a-f]{7}$ ]]; then
              echo "::error::unexpected tag $TAG"
              exit 1
          fi
          cp "$BUNDLE_PATH" jxchange-schemas.zip.sigstore.json
          gh release create "$TAG" jxchange-schemas.zip SHA256SUMS jxchange-schemas.zip.sigstore.json \
              --target "$GITHUB_SHA" --title "jXchange schemas $TAG" --notes-file notes.md --latest
