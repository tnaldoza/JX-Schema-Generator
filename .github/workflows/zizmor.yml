name: zizmor

on:
  push:
    branches: [master]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit workflows
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read # check out a repository that is not public
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ! Code scanning outside public repositories needs Code Security, so those get annotations and a job that fails on findings
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: ${{ github.event.repository.visibility == 'public' }}
          annotations: ${{ github.event.repository.visibility != 'public' }}
