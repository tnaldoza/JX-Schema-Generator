# yaml-language-server: $schema=https://lefthook.dev/schema.json
min_version: 2.2.1
# ! The default gobwas matcher reads ** as one or more directories, so root files would be skipped
glob_matcher: doublestar
assert_lefthook_installed: true

pre-commit:
  parallel: true
  skip:
    - merge
    - rebase
  jobs:
    - name: csharpier
      glob: "**/*.{cs,csx,csproj,props,targets,slnx,config,xml}"
      run: dotnet tool restore --verbosity quiet && dotnet csharpier format {staged_files}
      stage_fixed: true
    - name: prettier
      glob:
        - "**/*.{json,jsonc,yml,yaml,ts,mts,js,mjs,cjs}"
        - "**/.prettierrc"
      exclude:
        - pnpm-lock.yaml
      run: pnpm exec prettier --write --ignore-unknown -- {staged_files}
      stage_fixed: true
    - name: markdownlint
      glob: "**/*.md"
      # ! --no-globs stops the config's **/*.md globs from adding unstaged files
      run: pnpm exec markdownlint-cli2 --no-globs --fix -- {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: dotnet-build
      glob:
        - "**/*.{cs,csx,csproj,props,targets,slnx,config,json}"
        - "**/.editorconfig"
      run: dotnet build JXSchemaGenerator.slnx -c Release --nologo
